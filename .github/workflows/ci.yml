name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-build-install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test and build tooling
        run: python -m pip install ".[dev]" build twine

      - name: Test
        run: python -m pytest

      - name: Type-check
        run: python -m mypy

      - name: Build and check distributions
        run: |
          python -m build --outdir dist
          python -m twine check dist/*

      - name: Inspect artifact inventories and metadata
        run: |
          python - <<'PY'
          from email.parser import BytesParser
          from pathlib import Path, PurePosixPath
          import tarfile
          import zipfile

          dist = Path("dist")
          wheels = list(dist.glob("pysemtm0009-0.1.0-py3-none-any.whl"))
          sdists = list(dist.glob("pysemtm0009-0.1.0.tar.gz"))
          assert len(wheels) == 1, wheels
          assert len(sdists) == 1, sdists
          assert len(list(dist.iterdir())) == 2, list(dist.iterdir())

          with zipfile.ZipFile(wheels[0]) as archive:
              wheel_members = archive.namelist()
              print("wheel members:")
              print("\n".join(wheel_members))
              modules = {
                  PurePosixPath(name).name
                  for name in wheel_members
                  if name.startswith("semtm0009/") and name.endswith(".py")
              }
              assert modules == {
                  "__init__.py", "analysis.py", "continuation.py",
                  "continuation_api.py", "models.py", "plotting.py",
                  "reduced_neuron.py", "types.py",
              }
              assert len([name for name in wheel_members if name.endswith("/LICENSE")]) == 1
              forbidden = ("tests/", "__pycache__", ".pytest_cache", "workshop", "graft/", ".github/", "scripts/", "semtm0009_continuation.py")
              assert not any(any(part in name for part in forbidden) for name in wheel_members)
              metadata_name = next(name for name in wheel_members if name.endswith(".dist-info/METADATA"))
              metadata = BytesParser().parsebytes(archive.read(metadata_name))
              assert metadata["Name"] == "pysemtm0009"
              assert metadata["Version"] == "0.1.0"
              assert metadata["Requires-Python"] == ">=3.11, <3.13"

          with tarfile.open(sdists[0], "r:gz") as archive:
              sdist_members = archive.getnames()
              print("sdist members:")
              print("\n".join(sdist_members))
              assert any(name.endswith("/pyproject.toml") for name in sdist_members)
              assert any(name.endswith("/README.md") for name in sdist_members)
              assert any(name.endswith("/semtm0009/__init__.py") for name in sdist_members)
              assert not any("__pycache__" in name or ".pytest_cache" in name for name in sdist_members)
          PY

      - name: Install wheel in a clean environment
        run: |
          wheel=$(python -c 'from pathlib import Path; print(next(Path("dist").glob("*.whl")).resolve())')
          python -m venv "$RUNNER_TEMP/pysemtm0009-wheel"
          "$RUNNER_TEMP/pysemtm0009-wheel/bin/python" -m pip install "$wheel"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/pysemtm0009-wheel/bin/python" -I - <<'PY'
          from importlib.metadata import version
          from pathlib import Path
          import sys
          import numpy as np
          import semtm0009
          from semtm0009 import IZHIKEVICH_PRACTICAL_PARAMETERS, continue_equilibrium, reduced_neuron

          origin = Path(semtm0009.__file__).resolve()
          environment = Path(sys.prefix).resolve()
          assert origin.is_relative_to(environment), (origin, environment)
          assert version("pysemtm0009") == semtm0009.__version__ == "0.1.0"
          params = dict(IZHIKEVICH_PRACTICAL_PARAMETERS)
          rate = reduced_neuron(0.0, np.array([-65.0, 0.001]), params)
          np.testing.assert_allclose(rate, [-1.6853170560830506, -0.0006646498695335219], rtol=1e-12, atol=1e-14)
          branch = continue_equilibrium(
              reduced_neuron, [-65.952951263, 2.77173342e-4], "I", params,
              initial_parameter_step=0.05, arclength_step=0.15,
              max_points=5, parameter_bounds=(-1.0, 6.0),
          )
          assert branch.parameters.shape == (5,)
          assert np.all(branch.converged)
          print(f"installed {version('pysemtm0009')} from {origin}")
          PY
